name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Ручной запуск со вкладки Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новый деплой отменяет ещё не начавшийся, но не прерывает идущий.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - id: pages
        uses: actions/configure-pages@v5

      # Сайт публикуется в подпапке (/имя-репозитория/), сборке нужен этот путь.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
